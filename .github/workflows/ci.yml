name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }} / Codex installation
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Install marketplace and run installed hook
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-install-test
        shell: pwsh
        run: ./tests/test_plugin_install.ps1

  test:
    name: ${{ matrix.os }} / ${{ matrix.shell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            command: /bin/bash tests/test_project_map.sh
          - os: ubuntu-latest
            shell: pwsh
            command: ./tests/test_project_map.ps1
          - os: windows-latest
            shell: pwsh
            command: ./tests/test_project_map.ps1
          - os: macos-latest
            shell: bash
            command: PATH=/usr/bin:/bin:/usr/sbin:/sbin /bin/bash tests/test_project_map.sh
    steps:
      - uses: actions/checkout@v5
      - name: Run Bash tests
        if: matrix.shell == 'bash'
        shell: bash
        run: ${{ matrix.command }}
      - name: Run PowerShell tests
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ${{ matrix.command }}
      - name: Verify nested Git workspace and worktree exclusion end to end
        shell: pwsh
        run: ./tests/test_nested_git_e2e.ps1 -Shell '${{ matrix.shell }}'
